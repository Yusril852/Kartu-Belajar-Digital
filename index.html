<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kartu Belajar Digital – Bimbingan Belajar Cerdas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6f8;--card:#fff;--tx:#1a2330;--mut:#5b6877;--bd:#d5dce4;--ac:#1b6fd1;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1b222b;--tx:#e8edf2;--mut:#98a5b3;--bd:#2f3a47;--ac:#5aa2f5;--acx:#08121f}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1b222b;--tx:#e8edf2;--mut:#98a5b3;--bd:#2f3a47;--ac:#5aa2f5;--acx:#08121f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media(min-width:900px){.wrap{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:start}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
h1{font-size:19px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 12px;font-size:13px}
label{display:block;font-size:12px;color:var(--mut);margin:0 0 3px}
.row{display:grid;gap:10px;grid-template-columns:1fr 1fr;margin-bottom:10px}
input[type=text],input[type=date]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.seg{display:flex;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px 6px;border:0;background:var(--bg);color:var(--tx);font:inherit;cursor:pointer}
.seg button.on{background:var(--ac);color:var(--acx);font-weight:600}
.rows{display:grid;gap:8px;margin-top:6px}
.r{display:grid;grid-template-columns:24px 1fr;gap:6px 8px;align-items:center;padding:8px;border:1px solid var(--bd);border-radius:8px}
.r.off{opacity:.4;pointer-events:none}
.r b{font-size:13px;color:var(--mut)}
.f{display:grid;grid-template-columns:132px 1fr;gap:6px}
.c{grid-column:2;display:flex;gap:16px;font-size:13px;color:var(--mut)}
.c label{display:flex;align-items:center;gap:5px;margin:0;color:var(--tx)}
.dl{width:100%;padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:600 16px inherit;font-family:inherit;cursor:pointer;margin-top:10px}
.msg{font-size:13px;color:var(--mut);margin-top:8px;min-height:18px}
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px)}
canvas{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;display:block}
.imp{border:1px dashed var(--bd);border-radius:10px;padding:10px;margin-bottom:12px}
select,.sb{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
select{width:100%}.sb{cursor:pointer;white-space:nowrap}
textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
.ir{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:8px}
</style></head><body>
<div class="wrap">
<div class="panel">
<h1>Kartu Belajar Digital</h1>
<p class="sub">Bimbingan Belajar Cerdas – isi kartu, lalu unduh JPG.</p>

  L.forEach(function(ln){if(!ln.trim())return;var c=ln.indexOf("\t")>=0?ln.split("\t"):ln.trim().split(/\s{2,}|;/);
    c=c.map(function(x){return x.trim()}).filter(function(x,i,a){return x!==""||i<3});
    var k=-1;for(var i=0;i<c.length;i++)if(/^\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{2,4}$/.test(c[i])){k=i;break}
    if(k<0){bad++;return}
    var mt=c.slice(k+1).filter(function(x){return x}).join(" ");
    out.push({tgl:nd(c[k]),mat:mt.slice(0,40)})});
  if(!out.length){bm.textContent="Tidak ada baris dengan tanggal. Format: HARI, TANGGAL (dd/mm/yyyy), MATERI.";return}
  var n=Math.min(out.length,16);
  if(n>S.jml){S.jml=n<=4?4:n<=8?8:12;setSeg("jml",S.jml)}
  for(var i=0;i<16;i++){var o=out[i];var old=S.rows[i]||{};S.rows[i]=i<S.jml&&o?{tgl:o.tgl,mat:o.mat,t:!!o.tgl,o:!!old.o}:{tgl:"",mat:"",t:false,o:false}}
  build();draw();
  bm.textContent=Math.min(n,S.jml)+" baris diisi (hari dihitung otomatis dari tanggal, jumlah pertemuan "+S.jml+")."+(bad?" "+bad+" baris dilewati karena tanggal tidak terbaca.":"")+(out.length>S.jml?" Kelebihan baris diabaikan.":"");
};
fillNama();fillKelas();build();draw();
</script></body></html>
